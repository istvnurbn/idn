# ~/.abcde.conf
# abcde only rips + encodes into the staging folder.
# Picard does the real tagging, renaming and moving into ~/Music.
#
# Use the rip-cd wrapper for a one-line progress display.
# Plain `abcde` still works the old way.
# For box sets: `rip-cd -W 2` on disc 2, so files are 201-..., 202-... and
# never clash with disc 1 in staging.

# ---------- CDDB ----------
CDDBMETHOD=cddb
CDDBURL="http://gnudb.gnudb.org/~cddb/cddb.cgi"
CDDBCOPYLOCAL="y"
CDDBLOCALDIR="$HOME/.cddb"
CDDBLOCALRECURSIVE="y"
CDDBUSELOCAL="y"

# ---------- Encoders (same settings as by hand) ----------
MP3ENCODERSYNTAX=lame
LAME=lame
LAMEOPTS="-V 0 -h --silent"

FLACENCODERSYNTAX=flac
FLAC=flac
FLACOPTS="-s -e -V -5"

# ---------- CD reader ----------
CD_PARANOIA=cd-paranoia
CDPARANOIAOPTS="-O 6 --never-skip=40"

# ---------- Tagging ----------
# abcde's CDDB tags are only a hint for Picard's lookup; Picard clears them on save.
CDDISCID=cd-discid
ID3TAGV=id3v2.3

# ---------- Actions ----------
ACTIONS=cddb,read,encode,tag,move,clean
OUTPUTTYPE="mp3,flac"

# ---------- Where ----------
OUTPUTDIR="$HOME/Music/staging"
OUTPUTFORMAT='${OUTPUT}/${ARTISTFILE}-${ALBUMFILE}-${YEAR}-${OUTPUT}/${TRACKNUM}-${ARTISTFILE}-${TRACKFILE}'
VAOUTPUTFORMAT='${OUTPUT}/VA-${ALBUMFILE}-${YEAR}-${OUTPUT}/${TRACKNUM}-${ARTISTFILE}-${TRACKFILE}'

# Same character rules as the Picard naming script, so staging names look
# like the final ones:
#   transliterate to ASCII (é -> e, ő -> o, ß -> ss), & -> and,
#   drop apostrophes, other brackets -> (), anything else -> _,
#   no __, no ((, no )), no leading/trailing _.
# Hyphens inside names become _ because - is the field separator.
# Needs uconv (icu.dev, from media-cli): same result on NixOS and macOS,
# and non-Latin scripts become Latin (Кино -> Kino) instead of empty.
# A name with nothing left (only symbols) becomes "unknown".
mungefilename ()
{
    local s
    s=$(printf '%s' "$*" \
    | uconv -x 'Any-Latin; Latin-ASCII' \
    | sed -e 's/&/ and /g' \
          -e "s/['\`]//g" \
          -e 's/[[{<]/(/g' -e 's/[]}>]/)/g' \
          -e 's/([[:space:]]*)//g' \
          -e 's/[^A-Za-z0-9()]\{1,\}/_/g' \
          -e 's/__*/_/g' \
          -e 's/((*_*/(/g' -e 's/_*))*/)/g' \
          -e 's/^_*//' -e 's/_*$//')
    printf '%s\n' "${s:-unknown}"
}

# ---------- Extra ----------
PADTRACKS=y
EXTRAVERBOSE=2
MAXPROCS=2
LOWDISK=n
EJECTCD=y
