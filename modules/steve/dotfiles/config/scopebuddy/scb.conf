# Moonshine sets MOONSHINE_CLIENT_* for apps it launches, and the
# moonshine-steam/heroic-launch wrappers restart the launcher under
# Moonshine's environment, so the variables reliably reach gamescope.
if [ -n "${MOONSHINE_CLIENT_WIDTH:-}" ]; then
  # Streaming: fill the client's screen exactly (-W/-H output, -w/-h render)
  # and match its refresh rate. HDR and VRR are physical-display features —
  # forcing them in a headless stream gives wrong colors or nothing at all.
  SCB_GAMESCOPE_ARGS="-f --force-grab-cursor -W $MOONSHINE_CLIENT_WIDTH -H $MOONSHINE_CLIENT_HEIGHT -w $MOONSHINE_CLIENT_WIDTH -h $MOONSHINE_CLIENT_HEIGHT -r $MOONSHINE_CLIENT_FRAMERATE"
  SCB_AUTO_RES=0
  SCB_AUTO_HDR=0
  SCB_AUTO_VRR=0
  SCB_AUTO_REFRESH=0
else
  # Local play on the physical display
  SCB_GAMESCOPE_ARGS="-f --hdr-enabled --force-grab-cursor --adaptive-sync"
  SCB_AUTO_RES=1
  SCB_AUTO_HDR=1
  SCB_AUTO_VRR=1
  SCB_AUTO_REFRESH=1
fi
