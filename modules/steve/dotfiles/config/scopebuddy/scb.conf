export PROTON_DXVK_LOWLATENCY=1
export PROTON_FSR4_UPGRADE=1
export MANGOHUD_CONFIG=no_display

if [ -n "${MOONSHINE_CLIENT_WIDTH:-}" ]; then
  # Streaming (Moonshine sets MOONSHINE_CLIENT_*): its compositor already
  # runs at the client's mode and carries HDR, so run the game directly. A
  # game that misbehaves there gets gamescope back in its AppID/<id>.conf
  # (guarded: moonshine-gamescope skips gamescope outside a stream):
  #   [ -n "${MOONSHINE_CLIENT_WIDTH:-}" ] && SCB_NOSCOPE=0 GAMESCOPE_BIN=moonshine-gamescope
  SCB_NOSCOPE=1
else
  # Local play on the physical display. Add --force-grab-cursor in a
  # game's AppID/<id>.conf if its mouse escapes the window.
  SCB_GAMESCOPE_ARGS="-f --hdr-enabled --adaptive-sync --mangoapp"
  SCB_AUTO_RES=1
  SCB_AUTO_HDR=1
  SCB_AUTO_VRR=1
  SCB_AUTO_REFRESH=1
fi
